<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escala do Posto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: barra superior com mês + abas; folha da escala em grade rolável com a coluna de nomes fixa; resumo e folgas por pessoa abaixo. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #e8eeec;
  --ink: #15302c;
  --ink-soft: #4f6662;
  --line: #cfdad7;
  --accent: #0f6b5f;
  --accent-ink: #ffffff;
  --folga-bg: #f6c4ad;
  --folga-ink: #7a2a0c;
  --ferias-bg: #c4daf6;
  --ferias-ink: #163f78;
  --fds: #e3e9e7;
  --alerta: #c3261f;
  --alerta-bg: #fbe1df;
  --ok: #1d7a43;
  --ok-bg: #dcf1e3;
  --aviso-bg: #fff1c7;
  --aviso-ink: #6b4d00;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a19; --surface: #162422; --surface-2: #1d2f2c; --ink: #e3eeec; --ink-soft: #9fb5b1;
    --line: #2c403d; --accent: #4cc2b0; --accent-ink: #062521; --folga-bg: #6b2f17; --folga-ink: #ffd9c7;
    --ferias-bg: #1f3d66; --ferias-ink: #d3e5ff; --fds: #1b2a28; --alerta: #ff7b72; --alerta-bg: #4a1715;
    --ok: #6fd896; --ok-bg: #173826; --aviso-bg: #4a3a0b; --aviso-ink: #ffe08a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a19; --surface: #162422; --surface-2: #1d2f2c; --ink: #e3eeec; --ink-soft: #9fb5b1;
  --line: #2c403d; --accent: #4cc2b0; --accent-ink: #062521; --folga-bg: #6b2f17; --folga-ink: #ffd9c7;
  --ferias-bg: #1f3d66; --ferias-ink: #d3e5ff; --fds: #1b2a28; --alerta: #ff7b72; --alerta-bg: #4a1715;
  --ok: #6fd896; --ok-bg: #173826; --aviso-bg: #4a3a0b; --aviso-ink: #ffe08a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 85%; text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.topo-in { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.marca { display: flex; align-items: baseline; gap: 10px; }
.marca h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.marca span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
.mes-nav { display: flex; align-items: center; gap: 6px; }
.mes-nav .mes { font-family: var(--font-display); font-weight: 700; font-size: 18px; min-width: 170px; text-align: center; }
.btn-ic { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.abas { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.abas button { border: 0; background: transparent; padding: 8px 12px; border-radius: 999px; font-weight: 700; color: var(--ink-soft); }
.abas button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: var(--r); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.btn.prim { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.perigo { color: var(--alerta); }
.btn:disabled { opacity: .55; cursor: progress; }
.barra-acoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-block: 18px 12px; }
.barra-acoes .esp { flex: 1; }

.status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.ruim { background: var(--alerta-bg); color: var(--alerta); }
.status.atencao { background: var(--aviso-bg); color: var(--aviso-ink); }
.painel h3.sub { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); margin-block: 12px 6px; }
ul.alertas.avisos li::marker { color: var(--aviso-ink); }
.aviso { background: var(--aviso-bg); color: var(--aviso-ink); border-radius: var(--r); padding: 10px 14px; margin-block: 8px; }
.confirma { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); padding: 8px 12px; border-radius: var(--r); }

.legenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-soft); margin-block: 6px 10px; }
.legenda i { display: inline-block; width: 18px; height: 18px; border-radius: 4px; vertical-align: -4px; margin-right: 5px; font-style: normal; font-size: 11px; font-weight: 700; text-align: center; line-height: 18px; }

.grade-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table.grade { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; min-width: 100%; }
.grade th, .grade td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; padding: 0; height: 34px; }
.grade thead th { font-size: 12px; font-weight: 700; padding: 4px 2px; background: var(--surface-2); }
.grade thead th .dn { display: block; font-family: var(--font-display); font-size: 15px; }
.grade thead th .ds { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); font-weight: 400; }
.grade .nome { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; padding: 4px 10px; min-width: 220px; max-width: 260px; font-size: 13px; line-height: 1.2; box-shadow: 1px 0 0 var(--line); }
.grade thead .nome { background: var(--surface-2); z-index: 3; }
.grade .nome small { display: block; color: var(--ink-soft); font-size: 11px; }
.grade td.dia { width: 34px; min-width: 34px; }
.grade td.dia button { width: 100%; height: 34px; border: 0; background: transparent; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
.grade td.dia.fds, .grade th.fds { background: var(--fds); }
.grade td.dia.F button { background: var(--folga-bg); color: var(--folga-ink); }
.grade td.dia.V button { background: var(--ferias-bg); color: var(--ferias-ink); cursor: not-allowed; }
.grade td.dia.par button { outline: 2px solid var(--alerta); outline-offset: -3px; }
.grade td.tot { min-width: 64px; font-weight: 700; padding-inline: 6px; font-size: 13px; }
.grade td.tot.ruim { color: var(--alerta); background: var(--alerta-bg); }
.grade tfoot td { font-weight: 700; font-size: 13px; background: var(--surface-2); }
.grade tfoot td.nome { background: var(--surface-2); }
.grade tfoot tr.total td { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.grade tfoot tr.total td.nome { background: var(--accent); }
.grade tfoot td.ruim { background: var(--alerta) !important; color: #fff !important; }

.colunas { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; margin-top: 24px; }
@media (max-width: 900px) { .colunas { grid-template-columns: minmax(0, 1fr); } }
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.painel h2 { font-size: 18px; margin-bottom: 10px; }
.lista-pessoas { display: grid; gap: 0; }
.pessoa { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.pessoa:last-child { border-bottom: 0; }
.pessoa b { font-size: 14px; }
.pessoa .meta { font-size: 13px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--folga-bg); color: var(--folga-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.fe { background: var(--ferias-bg); color: var(--ferias-ink); }
.chip.nada { background: var(--surface-2); color: var(--ink-soft); font-weight: 400; }
ul.alertas { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
ul.alertas li::marker { color: var(--alerta); }

.form-linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.campo { display: grid; gap: 4px; font-size: 13px; color: var(--ink-soft); min-width: 0; }
.campo input, .campo select { border: 1px solid var(--line); background: var(--surface); padding: 8px 10px; border-radius: 6px; color: var(--ink); min-width: 0; }
table.tab { width: 100%; border-collapse: collapse; font-size: 14px; }
.tab th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); padding: 8px 6px; border-bottom: 1px solid var(--line); }
.tab td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tab input, .tab select { width: 100%; border: 1px solid transparent; background: transparent; padding: 6px 8px; border-radius: 6px; }
.tab input:hover, .tab input:focus, .tab select:hover, .tab select:focus { border-color: var(--line); background: var(--surface); }
.tab input[type="number"] { width: 80px; }
.tab-box { overflow-x: auto; }
.vazio { padding: 32px 16px; text-align: center; color: var(--ink-soft); }
.vazio h2 { color: var(--ink); margin-bottom: 8px; }
.nota { font-size: 13px; color: var(--ink-soft); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; z-index: 50; max-width: calc(100% - 32px); }
.tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); font-weight: 700; }
.tag.agora { background: var(--ferias-bg); color: var(--ferias-ink); }
@media (prefers-reduced-motion: no-preference) { .grade td.dia button { transition: background-color .12s; } }
</style>
<style>[hidden]{display:none!important}</style>
</head>
<body>

<header class="topo">
  <div class="topo-in">
    <div class="marca"><h1>Escala do Posto</h1><span>Posto de Saúde</span></div>
    <div class="mes-nav">
      <button class="btn-ic" id="mes-ant" aria-label="Mês anterior">‹</button>
      <div class="mes" id="mes-titulo">—</div>
      <button class="btn-ic" id="mes-prox" aria-label="Próximo mês">›</button>
    </div>
    <nav class="abas" role="tablist">
      <button role="tab" data-aba="escala" aria-selected="true">Escala</button>
      <button role="tab" data-aba="funcionarios" aria-selected="false">Funcionários</button>
      <button role="tab" data-aba="ferias" aria-selected="false">Férias</button>
      <button role="tab" data-aba="regras" aria-selected="false">Regras</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><div class="vazio"><h2>Carregando a escala…</h2></div></main>
<div class="toast" id="toast" hidden></div>
<input type="file" id="arquivo-import" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="dados-iniciais.js"></script>
<script>
"use strict";
// ======================= utilidades =======================
const DIAS_SEM = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const TURNO_7 = '07H00 às 16H00', TURNO_8 = '08H00 às 17H00';
const pad = n => String(n).padStart(2, '0');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const novoId = () => 'f' + Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
function grupoDoTurno(t) {
  const s = String(t || '').toUpperCase().replace(/\s+/g, '');
  if (s.startsWith('07H00') && s.endsWith('16H00')) return '7';
  if (s.startsWith('08H00') && s.endsWith('17H00')) return '8';
  return 'X';
}
function infoMes(chave) {
  const [a, m] = chave.split('-').map(Number);
  const nDias = new Date(a, m, 0).getDate();
  const dow = [], datas = [];
  for (let d = 1; d <= nDias; d++) { dow.push(new Date(a, m - 1, d).getDay()); datas.push(`${a}-${pad(m)}-${pad(d)}`); }
  return { ano: a, mes: m, nDias, dow, datas, nome: `${MESES[m - 1]} de ${a}` };
}
const somaMes = (chave, n) => { const [a, m] = chave.split('-').map(Number); const d = new Date(a, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const fmtData = iso => { const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; };
const ehUtil = w => w >= 1 && w <= 5, ehSegSex = w => w === 1 || w === 5, ehFds = w => w === 0 || w === 6;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

// ======================= gerador de folgas =======================
// Recozimento simulado: move folgas entre dias até não haver conflito e a distribuição ficar equilibrada.
// Férias entram como ausência fixa em todas as regras (mínimo do dia, turnos e duplas).
function gerarFolgas(cfg) {
  const { nDias, dow, funcionarios: F, pares, minTotal, min7, min8 } = cfg;
  const N = F.length;
  const n7 = F.filter(f => f.grupo === '7').length, n8 = F.filter(f => f.grupo === '8').length;
  const maxOff = N - minTotal, max7 = n7 - min7, max8 = n8 - min8;
  const bloq = F.map(f => { const s = new Uint8Array(nDias); f.bloqueados.forEach(d => s[d] = 1); return s; });
  const livres = F.map((f, i) => { const a = []; for (let d = 0; d < nDias; d++) if (!bloq[i][d]) a.push(d); return a; });
  const metas = F.map((f, i) => Math.max(0, Math.min(f.meta, livres[i].length)));
  const temSS = F.map((f, i) => livres[i].some(d => ehSegSex(dow[d])));
  const idealFds = F.map((f, i) => livres[i].length ? metas[i] * livres[i].filter(d => ehFds(dow[d])).length / livres[i].length : 0);
  const fix = new Array(nDias).fill(0), fix7 = new Array(nDias).fill(0), fix8 = new Array(nDias).fill(0);
  F.forEach((f, i) => { for (let d = 0; d < nDias; d++) if (bloq[i][d]) { fix[d]++; if (f.grupo === '7') fix7[d]++; if (f.grupo === '8') fix8[d]++; } });
  const media = (metas.reduce((a, b) => a + b, 0) + fix.reduce((a, b) => a + b, 0)) / nDias;
  let seed = (cfg.seed || Date.now()) % 2147483647 || 1;
  const rnd = () => (seed = (seed * 48271) % 2147483647) / 2147483647;
  const ri = n => Math.floor(rnd() * n);
  const aus = F.map(() => new Uint8Array(nDias));
  const porDia = new Array(nDias), o7 = new Array(nDias), o8 = new Array(nDias);

  function custo(off) {
    let duro = 0, c = 0;
    for (let d = 0; d < nDias; d++) { porDia[d] = fix[d]; o7[d] = fix7[d]; o8[d] = fix8[d]; }
    for (let i = 0; i < N; i++) {
      const a = aus[i]; for (let d = 0; d < nDias; d++) a[d] = bloq[i][d];
      for (const d of off[i]) { if (d < 0) { c += 20000; continue; } a[d] = 2; porDia[d]++; if (F[i].grupo === '7') o7[d]++; if (F[i].grupo === '8') o8[d]++; }
    }
    for (let d = 0; d < nDias; d++) {
      if (porDia[d] > maxOff) duro += porDia[d] - maxOff;
      if (ehUtil(dow[d])) { if (o7[d] > Math.max(0, max7)) duro += o7[d] - Math.max(0, max7); if (o8[d] > Math.max(0, max8)) duro += o8[d] - Math.max(0, max8); }
      c += 30 * (porDia[d] - media) ** 2;
    }
    for (const [x, y] of pares) for (let d = 0; d < nDias; d++) if (aus[x][d] && aus[y][d] && !(bloq[x][d] && bloq[y][d])) duro++;
    for (let i = 0; i < N; i++) {
      if (!metas[i]) continue;
      const o = off[i];
      if (temSS[i] && !o.some(d => d >= 0 && ehSegSex(dow[d]))) c += 5000;
      const nf = o.filter(d => d >= 0 && ehFds(dow[d])).length;
      c += 400 * (nf - idealFds[i]) ** 2;
      let corrida = 0; const a = aus[i];
      for (let d = 0; d < nDias; d++) {
        if (a[d]) { if (corrida > 7) c += 60 * (corrida - 7) ** 2; corrida = 0; if (a[d] === 2 && d > 0 && a[d - 1] === 2) c += 800; }
        else corrida++;
      }
      if (corrida > 7) c += 60 * (corrida - 7) ** 2;
    }
    return { c: c + duro * 100000, duro };
  }
  function inicial() {
    return F.map((f, i) => { const pool = livres[i].slice(), out = []; while (out.length < metas[i]) out.push(pool.splice(ri(pool.length), 1)[0]); return out; });
  }
  let melhor = null;
  for (let r = 0; r < (cfg.reinicios || 5); r++) {
    const off = inicial(); let cur = custo(off).c, T = 2000;
    for (let it = 0; it < (cfg.iteracoes || 30000); it++) {
      const i = ri(N); if (!off[i].length) continue;
      // às vezes tenta deixar a folga sem dia (-1): melhor uma folga pendente do que um dia abaixo do mínimo
      const k = ri(off[i].length), d = rnd() < 0.08 ? -1 : livres[i][ri(livres[i].length)];
      if (d >= 0 && off[i].includes(d)) continue;
      if (d === off[i][k]) continue;
      const velho = off[i][k]; off[i][k] = d;
      const nc = custo(off).c;
      if (nc <= cur || rnd() < Math.exp((cur - nc) / T)) cur = nc; else off[i][k] = velho;
      T = Math.max(1, T * 0.9997);
    }
    if (!melhor || cur < melhor.c) melhor = { c: cur, off: off.map(a => a.slice().sort((x, y) => x - y)) };
    if (melhor.off.every(a => !a.includes(-1)) && custo(melhor.off).duro === 0 && r >= 1) break;
  }
  const pendentes = melhor.off.reduce((s, a) => s + a.filter(d => d < 0).length, 0);
  return { off: melhor.off.map(a => a.filter(d => d >= 0)), violacoes: custo(melhor.off).duro, pendentes };
}

// ======================= modelo da escala =======================
function diasFeriasNoMes(cad, funcId, info) {
  const set = new Set();
  for (const fe of cad.ferias || []) {
    if (fe.funcId !== funcId) continue;
    info.datas.forEach((iso, d) => { if (iso >= fe.inicio && iso <= fe.fim) set.add(d); });
  }
  return set;
}
// Folgas proporcionais aos dias a trabalhar no mês (dias do mês menos férias), até o máximo da pessoa.
// Ex.: dezembro (31 dias) com 15 de férias -> 16 dias a trabalhar -> 5 x 16 / 31 = 2,6 -> 3 folgas.
function metaFolgas(f, nFerias, nDias) {
  if (!f.folgas) return 0;
  return Math.min(f.folgas, Math.round(f.folgas * (nDias - nFerias) / nDias));
}
const contaFolgas = (f, nFerias, nDias) => `${f.folgas} × ${nDias - nFerias} ÷ ${nDias} = ${(f.folgas * (nDias - nFerias) / nDias).toFixed(1).replace('.', ',')}`;
function montarGrade(chave) {
  const info = infoMes(chave), cad = estado.cadastro, escala = estado.escalas[chave];
  const linhas = cad.funcionarios.map(f => {

    for (let d = 0; d < info.nDias; d++) cel.push(fer.has(d) ? 'V' : (salvo[d] === 'F' ? 'F' : 'T'));

function validar(g) {

  for (let d = 0; d < info.nDias; d++) {

    linhas.forEach(l => { if (l.cel[d] === 'T') { tot++; if (l.grupo === '7') t7++; if (l.grupo === '8') t8++; } });
    const util = ehUtil(info.dow[d]);

    if (ruimTot) alertas.push(`${rot}: ${tot} trabalhando, mínimo é ${R.minTotal}.`);
    if (ruim7) alertas.push(`${rot}: ${t7} no turno ${TURNO_7}, mínimo é ${R.min7}.`);
    if (ruim8) alertas.push(`${rot}: ${t8} no turno ${TURNO_8}, mínimo é ${R.min8}.`);

        alertas.push(`${rot}: ${primeiroNome(la.f.nome)} e ${primeiroNome(lb.f.nome)} ausentes no mesmo dia.`);
      }

    dias.push({ tot, t7, t8, ruimTot, ruim7, ruim8 });

    const folgas = l.cel.reduce((s, c, d) => c === 'F' ? s.concat(d) : s, []);

    if (folgas.length < l.meta) avisos.push(`${primeiroNome(l.f.nome)}: ${folgas.length} de ${l.meta} folgas - ${l.meta - folgas.length} pendente(s) para não deixar o dia abaixo do mínimo.`);
    else if (folgas.length > l.meta) avisos.push(`${primeiroNome(l.f.nome)}: ${folgas.length} folgas, o previsto é ${l.meta}.`);
    if (l.meta > 0 && podeSS && ss === 0) avisos.push(`${primeiroNome(l.f.nome)}: sem folga em segunda ou sexta neste mês.`);
    return { folgas, ss, fds, ruimMeta: folgas.length !== l.meta, ruimSS: l.meta > 0 && podeSS && ss === 0 };

const LIGA = ['DE', 'DA', 'DO', 'DAS', 'DOS', 'E'];

const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : '';
const nomeCurto = n => String(n).trim().split(/\s+/).map(w => LIGA.includes(w.toUpperCase()) ? w.toLowerCase() : cap(w)).join(' ');

// ======================= armazenamento =======================
// Com firebase-config.js preenchido os dados ficam no Firestore, compartilhados por todos que abrem o site.
// Dentro do claude.ai usa a capability "db"; sem nenhum dos dois, ficam no navegador (localStorage).
const CHAVE_LOCAL = 'escala-posto-saude-v1';
const estado = { cadastro: null, escalas: {}, modo: 'carregando' };
let db = null;
const filas = {};
function cadastroVazio() { return { versao: 1, atualizadoEm: new Date().toISOString(), funcionarios: [], pares: [], regras: { minTotal: 8, min7: 4, min8: 3 }, ferias: [] }; }
// O Firestore não guarda lista dentro de lista: as duplas vão para o banco como {a, b}.
const paraBanco = (caminho, dados) => caminho === 'app/cadastro' && dados ? { ...dados, pares: (dados.pares || []).map(([a, b]) => ({ a, b })) } : dados;
const doBanco = dados => dados && Array.isArray(dados.pares) ? { ...dados, pares: dados.pares.map(p => Array.isArray(p) ? p : [p.a, p.b]) } : dados;
// O banco pode devolver os campos em outra ordem; compara com as chaves ordenadas.
const textoEstavel = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map(c => [c, v[c]])) : v);
function gravarLocal() { try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify({ cadastro: estado.cadastro, escalas: estado.escalas })); } catch (e) { toast('Não foi possível salvar neste navegador.'); } }
function gravar(caminho, dados) {
  if (estado.modo === 'local') { gravarLocal(); return; }
  if (!db) return;
  filas[caminho] = (filas[caminho] || Promise.resolve()).then(() => db.doc(caminho).set(paraBanco(caminho, dados))).catch(e => {
    toast(e && (e.code === 'invalid_argument' || e.code === 'permission-denied') ? 'Você só pode ver esta escala; alterações não são salvas.' : 'Falha ao salvar. Verifique a internet e tente de novo.');

}
function salvarCadastro() { estado.cadastro.atualizadoEm = new Date().toISOString(); gravar('app/cadastro', clone(estado.cadastro)); }
const timersEscala = {};
function salvarEscala(chave, atraso = 0) {
  clearTimeout(timersEscala[chave]);
  timersEscala[chave] = setTimeout(() => gravar('escalas/' + chave, clone(estado.escalas[chave])), atraso);
}
function iniciarLocal() {
  estado.modo = 'local';
  let salvo = null;
  try { salvo = JSON.parse(localStorage.getItem(CHAVE_LOCAL) || 'null'); } catch (e) { salvo = null; }
  if (salvo && salvo.cadastro) { estado.cadastro = salvo.cadastro; estado.escalas = salvo.escalas || {}; }
  else if (window.DADOS_INICIAIS) { estado.cadastro = clone(window.DADOS_INICIAIS.cadastro); estado.escalas = clone(window.DADOS_INICIAIS.escalas || {}); gravarLocal(); }

async function abrirBanco() {
  if (window.claude && typeof window.claude.use === 'function') {
    try { const d = await window.claude.use('db'); if (d) return { banco: d, modo: 'compartilhado' }; } catch (e) {}
  }
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.projectId) {
    if (!window.firebase) { telaErro('O Firebase não carregou. Verifique a internet e recarregue a página.'); return 'erro'; }
    try { if (!firebase.apps.length) firebase.initializeApp(cfg); return { banco: firebase.firestore(), modo: 'firebase' }; }
    catch (e) { telaErro('Não foi possível iniciar o Firebase. Confira o arquivo firebase-config.js.', e); return 'erro'; }
  }

}
function telaErro(msg, e) {
  if (e) console.error(e);
  $('#app').innerHTML = `<div class="vazio"><h2>Sem conexão com os dados</h2><p>${esc(msg)}</p>${e && e.code ? `<p class="nota">Código: ${esc(e.code)}</p>` : ''}</div>`;
}
async function iniciar() {
  const r = await abrirBanco();
  if (r === 'erro') return;
  if (!r) { iniciarLocal(); return; }
  db = r.banco; estado.modo = r.modo;
  let ultimoCad = '';
  db.doc('app/cadastro').onSnapshot(s => {
    const dados = s.exists ? doBanco(s.data()) : null;
    // Banco novo e vazio: grava a equipe e as escalas de dados-iniciais.js uma única vez.
    if (!dados && !estado.cadastro && window.DADOS_INICIAIS) {
      estado.cadastro = clone(window.DADOS_INICIAIS.cadastro);
      estado.escalas = { ...clone(window.DADOS_INICIAIS.escalas || {}), ...estado.escalas };
      ultimoCad = textoEstavel(estado.cadastro);
      gravar('app/cadastro', clone(estado.cadastro));
      Object.keys(window.DADOS_INICIAIS.escalas || {}).forEach(k => salvarEscala(k));
      render(); return;
    }
    const txt = textoEstavel(dados);
    if (estado.cadastro && (txt === ultimoCad || txt === textoEstavel(estado.cadastro))) { ultimoCad = txt; return; }
    ultimoCad = txt;
    estado.cadastro = dados ? clone(dados) : (estado.cadastro || cadastroVazio());
    render();
  }, e => estado.cadastro ? toast('A conexão com os dados foi interrompida. Recarregue a página.') : telaErro('O banco de dados recusou a conexão. Confira se o Firestore foi criado e se as regras foram publicadas.', e));

    q.docChanges().forEach(ch => {
      if (ch.type === 'removed') { delete estado.escalas[ch.doc.id]; mudou = true; return; }
      const novo = ch.doc.data();
      if (textoEstavel(estado.escalas[ch.doc.id]) !== textoEstavel(novo)) { estado.escalas[ch.doc.id] = clone(novo); mudou = true; }
    });
    if (mudou && estado.cadastro) render();
  }, e => console.error(e));
}

  if (!comFerias.length) h += `<p class="nota">Ninguém tem férias em ${esc(info.nome)}: todos ficam com o número cheio de folgas.</p>`;
  else {
    h += `<div class="tab-box"><table class="tab"><thead><tr><th>Funcionário</th><th>Dias de férias</th><th>Dias a trabalhar</th><th>Cálculo</th><th>Folgas no mês</th></tr></thead><tbody>`;
    comFerias.forEach(({ f, n }) => {
      h += `<tr><td>${esc(nomeCurto(f.nome))}</td><td>${n}</td><td>${info.nDias - n} de ${info.nDias}</td><td>${contaFolgas(f, n, info.nDias)}</td><td><b>${metaFolgas(f, n, info.nDias)}</b> de ${f.folgas}</td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  h += `</div>`;
  const lista = (cad.ferias || []).slice().sort((a, b) => a.inicio.localeCompare(b.inicio));
  h += `<div class="painel" style="margin-top:18px"><h2>Períodos cadastrados</h2>`;
  if (!lista.length) h += `<p class="nota">Nenhum período de férias cadastrado.</p>`;
  else {
    h += `<div class="tab-box"><table class="tab"><thead><tr><th>Funcionário</th><th>Período</th><th>Dias</th><th>Observação</th><th></th></tr></thead><tbody>`;
    lista.forEach(fe => {
      const dias = Math.round((new Date(fe.fim + 'T12:00') - new Date(fe.inicio + 'T12:00')) / 864e5) + 1;
      const noMes = fe.fim >= info.datas[0] && fe.inicio <= info.datas[info.nDias - 1];
      h += `<tr><td>${esc(nomeCurto(nomes[fe.funcId] || 'Funcionário removido'))} ${noMes ? `<span class="tag agora">${esc(MESES[info.mes - 1])}</span>` : ''}</td><td>${fmtData(fe.inicio)} a ${fmtData(fe.fim)}</td><td>${dias}</td><td>${esc(fe.obs || '')}</td>
        <td><button class="btn perigo" data-acao="del-ferias" data-id="${fe.id}">Remover</button></td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  return h + `</div>`;
}

function telaRegras() {
  const cad = estado.cadastro, R = cad.regras;
  const opts = sel => cad.funcionarios.map(f => `<option value="${f.id}" ${f.id === sel ? 'selected' : ''}>${esc(nomeCurto(f.nome))}</option>`).join('');
  let h = `<div class="grid2"><section class="painel"><h2>Mínimos por dia</h2><div class="form-linha" style="flex-direction:column;align-items:stretch">
    <label class="campo">Mínimo de trabalhadores por dia (todos os dias)<input type="number" min="0" id="r-minTotal" data-regra="minTotal" value="${R.minTotal}"></label>
    <label class="campo">Mínimo no turno ${TURNO_7} (segunda a sexta)<input type="number" min="0" id="r-min7" data-regra="min7" value="${R.min7}"></label>
    <label class="campo">Mínimo no turno ${TURNO_8} (segunda a sexta)<input type="number" min="0" id="r-min8" data-regra="min8" value="${R.min8}"></label></div>
    <p class="nota">Também valem sempre: folgas distribuídas de forma equilibrada e pelo menos uma folga em segunda ou sexta, quando possível.</p></section>
    <section class="painel"><h2>Não podem folgar no mesmo dia</h2><div class="tab-box"><table class="tab"><tbody>`;
  (cad.pares || []).forEach(([a, b], i) => {
    h += `<tr><td><select id="pa-${i}" data-par="${i}" data-lado="0" aria-label="Funcionário 1">${opts(a)}</select></td><td>e</td><td><select id="pb-${i}" data-par="${i}" data-lado="1" aria-label="Funcionário 2">${opts(b)}</select></td><td><button class="btn perigo" data-acao="del-par" data-i="${i}">Remover</button></td></tr>`;
  });
  h += `</tbody></table></div><p><button class="btn" data-acao="add-par">Adicionar dupla</button></p><p class="nota">Férias contam como ausência: se uma pessoa da dupla estiver de férias, a outra não folga nesses dias.</p></section>
    <section class="painel"><h2>Cópia de segurança</h2><p class="nota">${estado.modo === 'firebase' ? 'Os dados ficam salvos no banco de dados (Firebase) e aparecem para todos que abrem o site. Qualquer pessoa com o link pode alterar: exporte uma cópia de vez em quando.' : estado.modo === 'compartilhado' ? 'Os dados ficam salvos junto com esta página e aparecem para todos que a abrem.' :'Os dados ficam salvos neste navegador. Exporte uma cópia para guardar ou para abrir em outro computador.'}</p>
    <div class="form-linha"><button class="btn" data-acao="exportar">Exportar dados (.json)</button><button class="btn" data-acao="importar">Importar dados</button></div></section></div>`;
  return h;
}

// ======================= ações =======================
function gerarMes() {
  const cad = estado.cadastro, info = infoMes(ui.mes);
  const F = cad.funcionarios.map(f => {
    const fer = diasFeriasNoMes(cad, f.id, info);
    return { id: f.id, grupo: grupoDoTurno(f.turno), bloqueados: [...fer], meta: metaFolgas(f, fer.size, info.nDias) };
  });
  const idx = Object.fromEntries(F.map((f, i) => [f.id, i]));
  const pares = (cad.pares || []).filter(([a, b]) => a in idx && b in idx && a !== b).map(([a, b]) => [idx[a], idx[b]]);
  ui.gerando = true; ui.confirmar = null; render();
  setTimeout(() => {
    const r = gerarFolgas({ nDias: info.nDias, dow: info.dow, funcionarios: F, pares, ...cad.regras, seed: Date.now() });
    const linhas = {};
    F.forEach((f, i) => { const s = new Set(r.off[i]); let t = ''; for (let d = 0; d < info.nDias; d++) t += s.has(d) ? 'F' : 'T'; linhas[f.id] = t; });
    estado.escalas[ui.mes] = { geradoEm: new Date().toISOString(), linhas };
    salvarEscala(ui.mes);
    ui.gerando = false; render();
    toast(r.violacoes ? 'Escala gerada, mas faltam pessoas em alguns dias. Veja a conferência.'
      : r.pendentes ? `Escala gerada. ${r.pendentes} folga(s) ficaram pendentes para manter o mínimo de pessoas.` : 'Escala gerada. Todas as regras atendidas.');
  }, 30);
}
function alternarCelula(i, d) {
  const g = montarGrade(ui.mes), l = g.linhas[i];
  if (!l || l.cel[d] === 'V') { toast('Dia de férias. Para mudar, edite o período na aba Férias.'); return; }
  const esc_ = estado.escalas[ui.mes];
  const atual = (esc_.linhas[l.f.id] || 'T'.repeat(g.info.nDias)).padEnd(g.info.nDias, 'T').split('');
  atual[d] = atual[d] === 'F' ? 'T' : 'F';
  esc_.linhas[l.f.id] = atual.join('');
  render(); salvarEscala(ui.mes, 700);
}

async function oferecerArquivo(nome, blob, salvarLocal) {
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: nome, data: blob }); toast('Arquivo salvo.'); }
      catch (e) { if (e && e.code !== 'declined') toast('Não foi possível salvar o arquivo aqui.'); }
      return;
    }
  }
  salvarLocal();
}

function baixarPDF() {
  if (!window.jspdf || !window.jspdf.jsPDF) { toast('O gerador de PDF não carregou. Verifique a internet e recarregue.'); return; }
  const g = montarGrade(ui.mes), v = validar(g), { info, linhas } = g, R = estado.cadastro.regras;
  const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const verde = [15, 107, 95], folga = [246, 196, 173], ferias = [196, 218, 246], fds = [227, 233, 231], verm = [195, 38, 31];
  const titulo = `Escala mensal de trabalho - ${cap(info.nome)}`;
  const cab = () => { doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(21, 48, 44); doc.text('Posto de Saúde', 10, 12); doc.setFontSize(11); doc.text(titulo, 10, 18); };
  cab();
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(79, 102, 98);
  doc.text('T = trabalhando   F = folga   V = férias   (colunas cinza: sábado e domingo)', W - 10, 18, { align: 'right' });
  const head = [['Funcionário', 'Turno', ...info.dow.map((w, d) => pad(d + 1)), 'Folgas'], ['', '', ...info.dow.map(w => DIAS_SEM[w].slice(0, 3)), '']];
  const body = linhas.map((l, i) => [nomeCurto(l.f.nome), l.f.turno.replace(' às ', '-'), ...l.cel, `${v.pessoas[i].folgas.length}`]);
  const foot = [
    ['Turno 07h-16h (mín. ' + R.min7 + ' seg-sex)', '', ...v.dias.map(d => String(d.t7)), ''],
    ['Turno 08h-17h (mín. ' + R.min8 + ' seg-sex)', '', ...v.dias.map(d => String(d.t8)), ''],
    ['TOTAL TRABALHANDO (mín. ' + R.minTotal + ')', '', ...v.dias.map(d => String(d.tot)), ''],
  ];
  const larguraDias = (W - 20 - 52 - 18 - 11) / info.nDias;
  const colStyles = { 0: { cellWidth: 52, halign: 'left' }, 1: { cellWidth: 18 } };
  for (let d = 0; d < info.nDias; d++) colStyles[d + 2] = { cellWidth: larguraDias };
  colStyles[info.nDias + 2] = { cellWidth: 11 };
  doc.autoTable({
    startY: 22, head, body, foot, theme: 'grid', margin: { left: 10, right: 10 }, columnStyles: colStyles,
    styles: { fontSize: 7, cellPadding: 1.4, minCellHeight: 7, halign: 'center', valign: 'middle', lineColor: [190, 205, 201], lineWidth: 0.15, textColor: [21, 48, 44] },
    headStyles: { fillColor: verde, textColor: 255, fontStyle: 'bold' },
    footStyles: { fillColor: [232, 238, 236], textColor: [21, 48, 44], fontStyle: 'bold' },
    didParseCell: c => {
      const col = c.column.index - 2;
      if (col < 0 || col >= info.nDias) { if (c.section === 'foot' && c.row.index === 2) { c.cell.styles.fillColor = verde; c.cell.styles.textColor = 255; } return; }
      const w = info.dow[col];
      if (c.section === 'head' && ehFds(w)) c.cell.styles.fillColor = [80, 110, 104];
      if (c.section === 'head' && c.row.index === 1) { c.cell.styles.fontSize = 5; c.cell.styles.cellPadding = 0.4; }
      if (c.section === 'body') {
        const val = c.cell.raw;
        if (val === 'F') { c.cell.styles.fillColor = folga; c.cell.styles.fontStyle = 'bold'; c.cell.styles.textColor = [122, 42, 12]; }
        else if (val === 'V') { c.cell.styles.fillColor = ferias; c.cell.styles.fontStyle = 'bold'; c.cell.styles.textColor = [22, 63, 120]; }
        else { if (ehFds(w)) c.cell.styles.fillColor = fds; c.cell.styles.textColor = [120, 140, 136]; }
        if (v.conflitoPar[c.row.index].has(col)) { c.cell.styles.lineColor = verm; c.cell.styles.lineWidth = 0.6; }
      }
      if (c.section === 'foot') {
        const dd = v.dias[col], ruim = [dd.ruim7, dd.ruim8, dd.ruimTot][c.row.index];
        if (c.row.index === 2) { c.cell.styles.fillColor = verde; c.cell.styles.textColor = 255; }
        if (ruim) { c.cell.styles.fillColor = verm; c.cell.styles.textColor = 255; }
      }
    },
  });
  doc.addPage(); cab();
  doc.autoTable({
    startY: 24, theme: 'grid', margin: { left: 10, right: 10 },
    head: [['Funcionário', 'Turno', 'Dias de folga', 'Férias no mês', 'Dias a trabalhar', 'Folgas', 'Seg/Sex', 'Sáb/Dom']],
    body: linhas.map((l, i) => {
      const p = v.pessoas[i];
      return [nomeCurto(l.f.nome), l.f.turno, p.folgas.map(d => `${pad(d + 1)}/${pad(info.mes)} (${DIAS_SEM[info.dow[d]].toLowerCase()})`).join(', ') || '-', periodosFerias(l.f.id, info).join('; ') || '-', `${info.nDias - l.nFerias} de ${info.nDias}`, `${p.folgas.length} de ${l.meta}`, String(p.ss), String(p.fds)];
    }),
    styles: { fontSize: 8, cellPadding: 1.6, valign: 'middle', textColor: [21, 48, 44], lineColor: [190, 205, 201], lineWidth: 0.15 },
    headStyles: { fillColor: verde, textColor: 255 },
    columnStyles: { 0: { cellWidth: 56 }, 1: { cellWidth: 24 }, 2: { cellWidth: 92 }, 3: { cellWidth: 32 }, 4: { cellWidth: 24, halign: 'center' }, 5: { halign: 'center' }, 6: { halign: 'center' }, 7: { halign: 'center' } },
  });
  let y = doc.lastAutoTable.finalY + 8;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text('Conferência das regras', 10, y); y += 5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  const regras = [`Mínimo de ${R.minTotal} trabalhando por dia (todos os dias).`, `Segunda a sexta: mínimo de ${R.min7} no turno ${TURNO_7} e ${R.min8} no turno ${TURNO_8}.`, 'Férias contam como ausência em todas as regras.', 'Folgas proporcionais aos dias a trabalhar no mês: folgas do mês inteiro x dias a trabalhar / dias do mês, arredondado.'];
  const pares = (estado.cadastro.pares || []).map(([a, b]) => { const n = id => nomeCurto(estado.cadastro.funcionarios.find(f => f.id === id)?.nome || '?'); return `${n(a)} e ${n(b)} não folgam no mesmo dia.`; });
  let linhasTxt = regras.concat(pares, ['']);
  linhasTxt = linhasTxt.concat(v.alertas.length ? ['Problemas de cobertura:'].concat(v.alertas.map(a => '- ' + a)) : ['Resultado: mínimos diários e duplas atendidos.']);
  if (v.avisos.length) linhasTxt = linhasTxt.concat(['', 'Observações:'], v.avisos.map(a => '* ' + a));
  linhasTxt.forEach(t => { if (y > 200) { doc.addPage(); cab(); y = 26; } if (t.startsWith('- ')) doc.setTextColor(195, 38, 31); else if (t.startsWith('* ')) doc.setTextColor(107, 77, 0); else doc.setTextColor(21, 48, 44); doc.text(t, 10, y); y += 4.2; });
  const n = doc.getNumberOfPages(), quando = new Date();
  for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFontSize(7); doc.setTextColor(120, 140, 136); doc.text(`Gerado em ${pad(quando.getDate())}/${pad(quando.getMonth() + 1)}/${quando.getFullYear()} às ${pad(quando.getHours())}:${pad(quando.getMinutes())}  ·  página ${p} de ${n}`, W - 10, 205, { align: 'right' }); }
  const nome = `Escala ${pad(info.mes)}-${info.ano} - Posto de Saude.pdf`;
  oferecerArquivo(nome, doc.output('blob'), () => doc.save(nome));
}

function exportar() {
  const txt = JSON.stringify({ cadastro: estado.cadastro, escalas: estado.escalas }, null, 2);
  const nome = `escala-posto-backup-${new Date().toISOString().slice(0, 10)}.json`;
  oferecerArquivo(nome, new Blob([txt], { type: 'application/json' }), () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
}
$('#arquivo-import').addEventListener('change', e => {
  const arq = e.target.files[0]; if (!arq) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d.cadastro || !Array.isArray(d.cadastro.funcionarios)) throw new Error('formato');
      estado.cadastro = d.cadastro; estado.escalas = d.escalas || {};
      salvarCadastro(); Object.keys(estado.escalas).forEach(k => salvarEscala(k));
      render(); toast('Dados importados.');
    } catch (err) { toast('Arquivo inválido. Use um arquivo exportado por este sistema.'); }
    e.target.value = '';
  };
  fr.readAsText(arq);
});

document.addEventListener('click', e => {
  const aba = e.target.closest('[data-aba]');
  if (aba) { ui.aba = aba.dataset.aba; ui.confirmar = null; render(); return; }
  const cel = e.target.closest('[data-cel]');
  if (cel) { const [i, d] = cel.dataset.cel.split(':').map(Number); alternarCelula(i, d); return; }
  const b = e.target.closest('[data-acao]'); if (!b) return;
  const cad = estado.cadastro, a = b.dataset.acao;
  if (a === 'gerar') gerarMes();
  else if (a === 'pedir-regerar') { ui.confirmar = 'regerar'; render(); }
  else if (a === 'cancelar') { ui.confirmar = null; render(); }
  else if (a === 'pdf') baixarPDF();
  else if (a === 'add-func') { cad.funcionarios.push({ id: novoId(), nome: 'NOVO FUNCIONÁRIO', turno: TURNO_7, folgas: 5 }); salvarCadastro(); render(); const ins = document.querySelectorAll('[data-campo="nome"]'); ins[ins.length - 1]?.select(); }
  else if (a === 'pedir-del-func') { ui.confirmar = 'del-func:' + b.dataset.id; render(); }
  else if (a === 'del-func') {
    const id = b.dataset.id;
    cad.funcionarios = cad.funcionarios.filter(f => f.id !== id);
    cad.pares = (cad.pares || []).filter(p => !p.includes(id));
    cad.ferias = (cad.ferias || []).filter(fe => fe.funcId !== id);
    ui.confirmar = null; salvarCadastro(); render(); toast('Funcionário removido.');
  }
  else if (a === 'del-ferias') { cad.ferias = cad.ferias.filter(fe => fe.id !== b.dataset.id); salvarCadastro(); render(); toast('Período de férias removido.'); }
  else if (a === 'add-par') { if (cad.funcionarios.length < 2) return; cad.pares = cad.pares || []; cad.pares.push([cad.funcionarios[0].id, cad.funcionarios[1].id]); salvarCadastro(); render(); }
  else if (a === 'del-par') { cad.pares.splice(Number(b.dataset.i), 1); salvarCadastro(); render(); }
  else if (a === 'exportar') exportar();
  else if (a === 'importar') $('#arquivo-import').click();
});
document.addEventListener('change', e => {
  const t = e.target, cad = estado.cadastro;
  if (t.dataset.func !== undefined) {
    const f = cad.funcionarios[Number(t.dataset.func)]; if (!f) return;
    const c = t.dataset.campo;
    f[c] = c === 'folgas' ? Math.max(0, Math.min(31, parseInt(t.value, 10) || 0)) : (c === 'nome' ? t.value.trim().toUpperCase() : t.value.trim());
    salvarCadastro(); setTimeout(render);
  } else if (t.dataset.regra) {
    cad.regras[t.dataset.regra] = Math.max(0, parseInt(t.value, 10) || 0); salvarCadastro(); setTimeout(render);
  } else if (t.dataset.par !== undefined) {
    cad.pares[Number(t.dataset.par)][Number(t.dataset.lado)] = t.value; salvarCadastro(); setTimeout(render);
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'form-ferias') return;
  e.preventDefault();
  const funcId = $('#fe-func').value, inicio = $('#fe-ini').value, fim = $('#fe-fim').value, obs = $('#fe-obs').value.trim();
  if (!funcId || !inicio || !fim) { toast('Preencha funcionário, início e fim.'); return; }
  if (fim < inicio) { toast('A data de fim precisa ser igual ou depois do início.'); return; }
  estado.cadastro.ferias = estado.cadastro.ferias || [];
  estado.cadastro.ferias.push({ id: novoId(), funcId, inicio, fim, obs });
  salvarCadastro(); render(); toast('Férias cadastradas. Gere a escala do mês de novo para redistribuir as folgas.');
});
function mudarMes(n) { ui.mes = somaMes(ui.mes, n); ui.confirmar = null; try { sessionStorage.setItem('escala-mes', ui.mes); } catch (e) {} render(); }
$('#mes-ant').addEventListener('click', () => mudarMes(-1));
$('#mes-prox').addEventListener('click', () => mudarMes(1));

iniciar();
</script>
