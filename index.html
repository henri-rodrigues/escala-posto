<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escala do Posto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: barra superior com mês + abas; folha da escala em grade rolável com a coluna de nomes fixa; resumo e folgas por pessoa abaixo. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #e8eeec;
  --ink: #15302c;
  --ink-soft: #4f6662;
  --line: #cfdad7;
  --accent: #0f6b5f;
  --accent-ink: #ffffff;
  --folga-bg: #f6c4ad;
  --folga-ink: #7a2a0c;
  --ferias-bg: #c4daf6;
  --ferias-ink: #163f78;
  --fds: #e3e9e7;
  --alerta: #c3261f;
  --alerta-bg: #fbe1df;
  --ok: #1d7a43;
  --ok-bg: #dcf1e3;
  --aviso-bg: #fff1c7;
  --aviso-ink: #6b4d00;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a19; --surface: #162422; --surface-2: #1d2f2c; --ink: #e3eeec; --ink-soft: #9fb5b1;
    --line: #2c403d; --accent: #4cc2b0; --accent-ink: #062521; --folga-bg: #6b2f17; --folga-ink: #ffd9c7;
    --ferias-bg: #1f3d66; --ferias-ink: #d3e5ff; --fds: #1b2a28; --alerta: #ff7b72; --alerta-bg: #4a1715;
    --ok: #6fd896; --ok-bg: #173826; --aviso-bg: #4a3a0b; --aviso-ink: #ffe08a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a19; --surface: #162422; --surface-2: #1d2f2c; --ink: #e3eeec; --ink-soft: #9fb5b1;
  --line: #2c403d; --accent: #4cc2b0; --accent-ink: #062521; --folga-bg: #6b2f17; --folga-ink: #ffd9c7;
  --ferias-bg: #1f3d66; --ferias-ink: #d3e5ff; --fds: #1b2a28; --alerta: #ff7b72; --alerta-bg: #4a1715;
  --ok: #6fd896; --ok-bg: #173826; --aviso-bg: #4a3a0b; --aviso-ink: #ffe08a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 85%; text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.topo-in { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.marca { display: flex; align-items: baseline; gap: 10px; }
.marca h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.marca span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
.mes-nav { display: flex; align-items: center; gap: 6px; }
.mes-nav .mes { font-family: var(--font-display); font-weight: 700; font-size: 18px; min-width: 170px; text-align: center; }
.btn-ic { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.abas { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.abas button { border: 0; background: transparent; padding: 8px 12px; border-radius: 999px; font-weight: 700; color: var(--ink-soft); }
.abas button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: var(--r); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.btn.prim { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.perigo { color: var(--alerta); }
.btn:disabled { opacity: .55; cursor: progress; }
.barra-acoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-block: 18px 12px; }
.barra-acoes .esp { flex: 1; }

.status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.ruim { background: var(--alerta-bg); color: var(--alerta); }
.status.atencao { background: var(--aviso-bg); color: var(--aviso-ink); }
.painel h3.sub { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); margin-block: 12px 6px; }
ul.alertas.avisos li::marker { color: var(--aviso-ink); }
.aviso { background: var(--aviso-bg); color: var(--aviso-ink); border-radius: var(--r); padding: 10px 14px; margin-block: 8px; }
.confirma { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); padding: 8px 12px; border-radius: var(--r); }

.legenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-soft); margin-block: 6px 10px; }
.legenda i { display: inline-block; width: 18px; height: 18px; border-radius: 4px; vertical-align: -4px; margin-right: 5px; font-style: normal; font-size: 11px; font-weight: 700; text-align: center; line-height: 18px; }

.grade-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table.grade { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; min-width: 100%; }
.grade th, .grade td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; padding: 0; height: 34px; }
.grade thead th { font-size: 12px; font-weight: 700; padding: 4px 2px; background: var(--surface-2); }
.grade thead th .dn { display: block; font-family: var(--font-display); font-size: 15px; }
.grade thead th .ds { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); font-weight: 400; }
.grade .nome { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; padding: 4px 10px; min-width: 220px; max-width: 260px; font-size: 13px; line-height: 1.2; box-shadow: 1px 0 0 var(--line); }
.grade thead .nome { background: var(--surface-2); z-index: 3; }
.grade .nome small { display: block; color: var(--ink-soft); font-size: 11px; }
.grade td.dia { width: 34px; min-width: 34px; }
.grade td.dia button { width: 100%; height: 34px; border: 0; background: transparent; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
.grade td.dia.fds, .grade th.fds { background: var(--fds); }
.grade td.dia.F button { background: var(--folga-bg); color: var(--folga-ink); }
.grade td.dia.V button { background: var(--ferias-bg); color: var(--ferias-ink); cursor: not-allowed; }
.grade td.dia.par button { outline: 2px solid var(--alerta); outline-offset: -3px; }
.grade td.tot { min-width: 64px; font-weight: 700; padding-inline: 6px; font-size: 13px; }
.grade td.tot.ruim { color: var(--alerta); background: var(--alerta-bg); }
.grade tfoot td { font-weight: 700; font-size: 13px; background: var(--surface-2); }
.grade tfoot td.nome { background: var(--surface-2); }
.grade tfoot tr.total td { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.grade tfoot tr.total td.nome { background: var(--accent); }
.grade tfoot td.ruim { background: var(--alerta) !important; color: #fff !important; }
.grade tfoot td.quarta { background: var(--aviso-bg) !important; color: var(--aviso-ink) !important; box-shadow: inset 0 0 0 2px var(--aviso-ink); }
.grade td.dia.X button { cursor: default; font-weight: 400; }
.grade tfoot td.fds { color: var(--ink-soft); background: var(--fds); }
.grade tfoot tr.total td.fds { background: var(--fds); color: var(--ink-soft); border-color: var(--line); }

.colunas { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; margin-top: 24px; }
@media (max-width: 900px) { .colunas { grid-template-columns: minmax(0, 1fr); } }
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.painel h2 { font-size: 18px; margin-bottom: 10px; }
.lista-pessoas { display: grid; gap: 0; }
.pessoa { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.pessoa:last-child { border-bottom: 0; }
.pessoa b { font-size: 14px; }
.pessoa .meta { font-size: 13px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--folga-bg); color: var(--folga-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.chip.fe { background: var(--ferias-bg); color: var(--ferias-ink); }
.chip.nada { background: var(--surface-2); color: var(--ink-soft); font-weight: 400; }
ul.alertas { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
ul.alertas li::marker { color: var(--alerta); }

.form-linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.campo { display: grid; gap: 4px; font-size: 13px; color: var(--ink-soft); min-width: 0; }
.campo input, .campo select { border: 1px solid var(--line); background: var(--surface); padding: 8px 10px; border-radius: 6px; color: var(--ink); min-width: 0; }
table.tab { width: 100%; border-collapse: collapse; font-size: 14px; }
.tab th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); padding: 8px 6px; border-bottom: 1px solid var(--line); }
.tab td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tab input, .tab select { width: 100%; border: 1px solid transparent; background: transparent; padding: 6px 8px; border-radius: 6px; }
.tab input:hover, .tab input:focus, .tab select:hover, .tab select:focus { border-color: var(--line); background: var(--surface); }
.tab input[type="number"] { width: 80px; }
.tab-box { overflow-x: auto; }
.vazio { padding: 32px 16px; text-align: center; color: var(--ink-soft); }
.vazio h2 { color: var(--ink); margin-bottom: 8px; }
.nota { font-size: 13px; color: var(--ink-soft); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; z-index: 50; max-width: calc(100% - 32px); }
.tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); font-weight: 700; }
.tag.agora { background: var(--ferias-bg); color: var(--ferias-ink); }
.check { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .grade td.dia button { transition: background-color .12s; } }
</style>
<style>[hidden]{display:none!important}</style>
</head>
<body>

<header class="topo">
  <div class="topo-in">
    <div class="marca"><h1>Escala do Posto</h1><span>Posto de Saúde</span></div>
    <div class="mes-nav">
      <button class="btn-ic" id="mes-ant" aria-label="Mês anterior">‹</button>
      <div class="mes" id="mes-titulo">—</div>
      <button class="btn-ic" id="mes-prox" aria-label="Próximo mês">›</button>
    </div>
    <nav class="abas" role="tablist">
      <button role="tab" data-aba="escala" aria-selected="true">Escala</button>
      <button role="tab" data-aba="funcionarios" aria-selected="false">Funcionários</button>
      <button role="tab" data-aba="ferias" aria-selected="false">Férias</button>
      <button role="tab" data-aba="agenda" aria-selected="false">Agenda</button>
      <button role="tab" data-aba="regras" aria-selected="false">Regras</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><div class="vazio"><h2>Carregando a escala…</h2></div></main>
<div class="toast" id="toast" hidden></div>
<input type="file" id="arquivo-import" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="dados-iniciais.js"></script>
<script>
"use strict";
// ======================= utilidades =======================
const DIAS_SEM = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const TURNO_7 = '07H00 às 16H00', TURNO_8 = '08H00 às 17H00';
const pad = n => String(n).padStart(2, '0');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const novoId = () => 'f' + Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
function grupoDoTurno(t) {
  const s = String(t || '').toUpperCase().replace(/\s+/g, '');
  if (s.startsWith('07H00') && s.endsWith('16H00')) return '7';
  if (s.startsWith('08H00') && s.endsWith('17H00')) return '8';
  return 'X';
}
function infoMes(chave) {
  const [a, m] = chave.split('-').map(Number);
  const nDias = new Date(a, m, 0).getDate();
  const dow = [], datas = [];
  for (let d = 1; d <= nDias; d++) { dow.push(new Date(a, m - 1, d).getDay()); datas.push(`${a}-${pad(m)}-${pad(d)}`); }
  return { ano: a, mes: m, nDias, dow, datas, nome: `${MESES[m - 1]} de ${a}` };
}
const somaMes = (chave, n) => { const [a, m] = chave.split('-').map(Number); const d = new Date(a, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const fmtData = iso => { const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; };
const ehUtil = w => w >= 1 && w <= 5, ehSegSex = w => w === 1 || w === 5, ehFds = w => w === 0 || w === 6, ehQuarta = w => w === 3;
const DIAS_LONGOS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const isoDe = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
function pascoa(ano) {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const n = h + l - 7 * m + 114;
  return new Date(ano, Math.floor(n / 31) - 1, (n % 31) + 1);
}
// Feriados nacionais, de SP e de Ribeirão Preto. Pontos facultativos vêm com o posto aberto; tudo pode ser trocado na aba Agenda.
function feriadosDoAno(ano) {
  const p = pascoa(ano), rel = n => isoDe(new Date(ano, p.getMonth(), p.getDate() + n)), fixo = (m, d) => `${ano}-${pad(m)}-${pad(d)}`;
  return [
    [fixo(1, 1), 'Confraternização Universal', 'nacional'],
    [fixo(1, 20), 'São Sebastião (padroeiro)', 'municipal'],
    [rel(-48), 'Carnaval (segunda)', 'facultativo'],
    [rel(-47), 'Carnaval (terça)', 'facultativo'],
    [rel(-46), 'Quarta-feira de Cinzas (até 14h)', 'facultativo'],
    [rel(-2), 'Sexta-feira Santa', 'nacional'],
    [fixo(4, 21), 'Tiradentes', 'nacional'],
    [fixo(5, 1), 'Dia do Trabalho', 'nacional'],
    [rel(60), 'Corpus Christi', 'facultativo'],
    [fixo(6, 19), 'Aniversário de Ribeirão Preto', 'municipal'],
    [fixo(7, 9), 'Revolução Constitucionalista', 'estadual'],
    [fixo(9, 7), 'Independência do Brasil', 'nacional'],
    [fixo(10, 12), 'Nossa Senhora Aparecida', 'nacional'],
    [fixo(10, 28), 'Dia do Servidor Público', 'facultativo'],
    [fixo(11, 2), 'Finados', 'nacional'],
    [fixo(11, 15), 'Proclamação da República', 'nacional'],
    [fixo(11, 20), 'Consciência Negra', 'nacional'],
    [fixo(12, 24), 'Véspera de Natal (após 14h)', 'facultativo'],
    [fixo(12, 25), 'Natal', 'nacional'],
    [fixo(12, 31), 'Véspera de Ano-Novo (após 14h)', 'facultativo'],
  ].map(([data, nome, tipo]) => ({ data, nome, tipo, fechadoPadrao: tipo !== 'facultativo' })).sort((x, y) => x.data.localeCompare(y.data));
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

// ======================= gerador de folgas =======================
// Recozimento simulado: move folgas entre dias até não haver conflito e a distribuição ficar equilibrada.
// Férias entram como ausência fixa em todas as regras (mínimo do dia, turnos e duplas).
// Dias com o posto fechado não contam: ninguém trabalha nem folga neles.
// Ordem de prioridade quando não cabe tudo: 1) nenhum dia abaixo do mínimo fora das quartas e duplas sempre respeitadas;
// 2) todas as folgas dadas, usando as quartas para ficar com menos gente; 3) só então folga pendente.
const CUSTO_PENDENTE = 20000;
const custoQuarta = falta => 10000 * falta + 2000 * falta * falta; // por unidade fica abaixo de CUSTO_PENDENTE até 4 a menos
function gerarFolgas(cfg) {
  const { nDias, dow, funcionarios: F, pares, minTotal, min7, min8 } = cfg;
  const fechado = cfg.fechado || new Uint8Array(nDias);
  const abertos = [], abertoAnterior = new Int16Array(nDias).fill(-1);
  for (let d = 0, ult = -1; d < nDias; d++) { abertoAnterior[d] = ult; if (!fechado[d]) { abertos.push(d); ult = d; } }
  const N = F.length;
  const n7 = F.filter(f => f.grupo === '7').length, n8 = F.filter(f => f.grupo === '8').length;
  const maxOff = N - minTotal, max7 = Math.max(0, n7 - min7), max8 = Math.max(0, n8 - min8);
  const bloq = F.map(f => { const s = new Uint8Array(nDias); f.bloqueados.forEach(d => s[d] = 1); return s; });
  const livres = F.map((f, i) => abertos.filter(d => !bloq[i][d]));
  const metas = F.map((f, i) => Math.max(0, Math.min(f.meta, livres[i].length)));
  const temSS = F.map((f, i) => livres[i].some(d => ehSegSex(dow[d])));
  const idealFds = F.map((f, i) => livres[i].length ? metas[i] * livres[i].filter(d => ehFds(dow[d])).length / livres[i].length : 0);
  const fix = new Array(nDias).fill(0), fix7 = new Array(nDias).fill(0), fix8 = new Array(nDias).fill(0);
  F.forEach((f, i) => { for (const d of abertos) if (bloq[i][d]) { fix[d]++; if (f.grupo === '7') fix7[d]++; if (f.grupo === '8') fix8[d]++; } });
  const media = abertos.length ? (metas.reduce((a, b) => a + b, 0) + abertos.reduce((s, d) => s + fix[d], 0)) / abertos.length : 0;
  let seed = (cfg.seed || Date.now()) % 2147483647 || 1;
  const rnd = () => (seed = (seed * 48271) % 2147483647) / 2147483647;
  const ri = n => Math.floor(rnd() * n);
  const aus = F.map(() => new Uint8Array(nDias));
  const porDia = new Array(nDias), o7 = new Array(nDias), o8 = new Array(nDias);

  function custo(off) {
    let duro = 0, c = 0, quarta = 0;
    for (const d of abertos) { porDia[d] = fix[d]; o7[d] = fix7[d]; o8[d] = fix8[d]; }
    for (let i = 0; i < N; i++) {

      const a = aus[i]; for (let d = 0; d < nDias; d++) a[d] = fechado[d] ? 3 : bloq[i][d];

function telaEscala() {
  const cad = estado.cadastro;
  if (!cad.funcionarios.length) return `<div class="vazio"><h2>Nenhum funcionário cadastrado</h2><p>Cadastre a equipe na aba <b>Funcionários</b>, depois volte aqui para gerar a escala.</p></div>`;
  const g = montarGrade(ui.mes), v = validar(g), { info, linhas, escala } = g;
  const nAlert = v.alertas.length, nAviso = v.avisos.length;
  let topo = `<div class="barra-acoes">`;
  if (escala) topo += nAlert ? `<span class="status ruim">● ${nAlert} ${nAlert === 1 ? 'problema de cobertura' : 'problemas de cobertura'}</span>`
    : `<span class="status ok">✓ Mínimos e duplas atendidos</span>${nAviso ? ` <span class="status atencao">${nAviso} ${nAviso === 1 ? 'observação' : 'observações'}</span>` : ''}`;
  topo += `<span class="esp"></span>`;
  if (ui.confirmar === 'regerar') topo += `<span class="confirma">Substituir as folgas de ${esc(info.nome)} por uma nova distribuição? <button class="btn prim" data-acao="gerar">Sim, gerar de novo</button><button class="btn" data-acao="cancelar">Cancelar</button></span>`;
  else topo += `<button class="btn ${escala ? '' : 'prim'}" data-acao="${escala ? 'pedir-regerar' : 'gerar'}" ${ui.gerando ? 'disabled' : ''}>${ui.gerando ? 'Gerando…' : (escala ? 'Gerar nova distribuição' : 'Gerar escala do mês')}</button>`;
  if (escala) topo += `<button class="btn prim" data-acao="pdf">Baixar PDF</button>`;
  topo += `</div>`;
  if (!escala) {
    const fer = linhas.filter(l => l.nFerias);
    return topo + `<div class="painel vazio"><h2>A escala de ${esc(info.nome)} ainda não foi gerada</h2><p>Clique em <b>Gerar escala do mês</b>. As folgas são distribuídas respeitando os mínimos, as duplas e as férias cadastradas.</p>${fer.length ? `<p>De férias neste mês: ${fer.map(l => `<b>${esc(nomeCurto(l.f.nome))}</b> (${l.nFerias} dias)`).join(', ')}.</p>` : ''}</div>`;
  }
  let html = topo;
  const desatualizada = escala.base ? escala.base !== assinaturaMes(ui.mes) : !!(escala.geradoEm && cad.atualizadoEm && cad.atualizadoEm > escala.geradoEm);
  if (desatualizada) html += `<div class="aviso">O cadastro (funcionários, férias ou regras) mudou depois que esta escala foi gerada. Confira os alertas ou clique em <b>Gerar nova distribuição</b>.</div>`;
  const fechados = g.fechados, temFds = info.dow.some((w, d) => ehFds(w) && !fechados.has(d));
  html += `<div class="legenda"><span><i style="background:var(--surface-2)">T</i>Trabalhando</span><span><i style="background:var(--folga-bg);color:var(--folga-ink)">F</i>Folga</span><span><i style="background:var(--ferias-bg);color:var(--ferias-ink)">V</i>Férias (dias corridos)</span><span><i style="background:var(--fds)">–</i>Posto fechado (fim de semana, feriado — aba Agenda)</span><span><i style="background:var(--aviso-bg);color:var(--aviso-ink)">!</i>Quarta com menos gente</span><span>Clique num dia para trocar entre T e F.</span></div>`;
  html += `<div class="grade-box"><table class="grade"><thead><tr><th class="nome">Funcionário</th>`;
  for (let d = 0; d < info.nDias; d++) html += `<th class="${fechados.has(d) ? 'fds' : ''}" ${fechados.has(d) ? `title="${esc(fechados.get(d))}"` : ''}><span class="dn">${pad(d + 1)}</span><span class="ds">${DIAS_SEM[info.dow[d]]}</span></th>`;
  html += `<th>Folgas</th><th>Seg/Sex</th>${temFds ? '<th>Sáb/Dom</th>' : ''}</tr></thead><tbody>`;
  linhas.forEach((l, i) => {
    const p = v.pessoas[i];
    html += `<tr><td class="nome"><b>${esc(nomeCurto(l.f.nome))}</b><small>${esc(l.f.turno)}${l.nFerias ? ` · ${l.nFerias} dias de férias` : ''}</small></td>`;
    l.cel.forEach((c, d) => {
      const cls = ['dia', c, fechados.has(d) ? 'fds' : '', v.conflitoPar[i].has(d) ? 'par' : ''].join(' ');
      const tit = c === 'V' ? 'Férias — altere na aba Férias' : c === 'X' ? `Posto fechado: ${fechados.get(d)}` : (c === 'F' ? 'Folga — clique para marcar trabalho' : 'Trabalhando — clique para marcar folga');
      html += `<td class="${cls}"><button data-cel="${i}:${d}" title="${esc(tit)}" aria-label="${esc(nomeCurto(l.f.nome))}, dia ${d + 1}: ${c === 'V' ? 'férias' : c === 'X' ? 'posto fechado' : c === 'F' ? 'folga' : 'trabalhando'}">${c === 'X' ? '–' : c}</button></td>`;
    });
    html += `<td class="tot ${p.ruimMeta ? 'ruim' : ''}">${p.folgas.length}/${l.meta}</td><td class="tot ${p.ruimSS ? 'ruim' : ''}">${p.ss}</td>${temFds ? `<td class="tot">${p.fds}</td>` : ''}</tr>`;
  });
  html += `</tbody><tfoot>`;
  const R = cad.regras;
  const linhaRes = (rot, campo, ruim, classe) => {
    let s = `<tr class="${classe || ''}"><td class="nome">${rot}</td>`;
    v.dias.forEach(dd => s += dd.fechado ? `<td class="fds">–</td>` : `<td class="${dd[ruim] ? (dd.quarta ? 'quarta' : 'ruim') : ''}">${dd[campo]}</td>`);
    return s + `<td colspan="${temFds ? 3 : 2}"></td></tr>`;
  };
  html += linhaRes(`Turno 07h–16h <small>mín. ${R.min7} (seg–sex)</small>`, 't7', 'ruim7');
  html += linhaRes(`Turno 08h–17h <small>mín. ${R.min8} (seg–sex)</small>`, 't8', 'ruim8');
  html += linhaRes(`Total trabalhando <small>mín. ${R.minTotal}</small>`, 'tot', 'ruimTot', 'total');
  html += `</tfoot></table></div>`;

  html += `<div class="colunas"><section class="painel"><h2>Folgas de cada pessoa</h2><div class="lista-pessoas">`;
  linhas.forEach((l, i) => {
    const p = v.pessoas[i];
    const chips = p.folgas.map(d => `<span class="chip">${pad(d + 1)} ${DIAS_SEM[info.dow[d]].toLowerCase()}</span>`);
    const fer = periodosFerias(l.f.id, info).map(t => `<span class="chip fe">Férias ${t}</span>`);
    html += `<div class="pessoa"><b>${esc(nomeCurto(l.f.nome))}</b><span class="meta">${p.folgas.length} de ${l.meta} folgas${l.nFerias ? `<br><small>proporcional a ${info.nDias - l.nFerias} de ${info.nDias} dias a trabalhar</small>` : ''}</span><div class="chips">${chips.join('') || (l.meta ? '' : '<span class="chip nada">Sem folgas previstas</span>')}${fer.join('')}</div></div>`;
  });
  html += `</div></section><section class="painel"><h2>Conferência das regras</h2>`;
  html += nAlert ? `<h3 class="sub">Cobertura</h3><ul class="alertas">${v.alertas.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : `<p class="status ok">✓ Mínimos e duplas atendidos</p>`;
  if (nAviso) html += `<h3 class="sub">Observações</h3><ul class="alertas avisos">${v.avisos.map(a => `<li>${esc(a)}</li>`).join('')}</ul>`;
  if (!nAlert && !nAviso) html += `<p class="nota">Mínimo diário, turnos de segunda a sexta, duplas que não folgam juntas, número de folgas e folga em segunda ou sexta conferidos nos ${info.nDias - fechados.size} dias com o posto aberto.</p>`;
  if (fechados.size) html += `<p class="nota">Posto fechado em ${fechados.size} dias deste mês${[...fechados].filter(([d]) => !ehFds(info.dow[d])).length ? ` (além dos fins de semana: ${[...fechados].filter(([d]) => !ehFds(info.dow[d])).map(([d, m]) => `${pad(d + 1)} – ${esc(m)}`).join('; ')})` : ''}.</p>`;
  if (nAlert) html += `<p class="nota">Quando há férias demais no mesmo período, alguns dias podem ficar abaixo do mínimo mesmo sem ninguém de folga. Reveja as férias desses dias.</p>`;
  html += `</section></div>`;
  return html;
}
function periodosFerias(funcId, info) {
  const ini = info.datas[0], fim = info.datas[info.nDias - 1];
  return (estado.cadastro.ferias || []).filter(fe => fe.funcId === funcId && fe.fim >= ini && fe.inicio <= fim)
    .map(fe => `${fmtData(fe.inicio).slice(0, 5)} a ${fmtData(fe.fim).slice(0, 5)}`);
}

function telaFuncionarios() {
  const cad = estado.cadastro;
  let h = `<div class="barra-acoes"><h2>Funcionários</h2><span class="esp"></span><button class="btn prim" data-acao="add-func">Adicionar funcionário</button></div>`;
  h += `<div class="painel"><div class="tab-box"><table class="tab"><thead><tr><th>Nome</th><th>Turno</th><th>Folgas no mês inteiro</th><th>Regra de turno</th><th></th></tr></thead><tbody>`;
  cad.funcionarios.forEach((f, i) => {
    const gr = grupoDoTurno(f.turno);
    h += `<tr><td><input id="fn-${f.id}" data-func="${i}" data-campo="nome" value="${esc(f.nome)}" aria-label="Nome"></td>
      <td><input id="ft-${f.id}" data-func="${i}" data-campo="turno" value="${esc(f.turno)}" list="turnos" aria-label="Turno"></td>
      <td><input id="ff-${f.id}" type="number" min="0" max="31" data-func="${i}" data-campo="folgas" value="${f.folgas}" aria-label="Folgas por mês"></td>
      <td><span class="tag">${gr === '7' ? 'Conta no 07h–16h' : gr === '8' ? 'Conta no 08h–17h' : 'Só no total'}</span></td>
      <td>${ui.confirmar === 'del-func:' + f.id ? `<span class="confirma">Remover? <button class="btn perigo" data-acao="del-func" data-id="${f.id}">Remover</button><button class="btn" data-acao="cancelar">Não</button></span>` : `<button class="btn perigo" data-acao="pedir-del-func" data-id="${f.id}">Remover</button>`}</td></tr>`;
  });
  h += `</tbody></table></div><datalist id="turnos"><option value="${TURNO_7}"><option value="${TURNO_8}"><option value="06H30 às 17H00"></datalist>`;
  h += `<p class="nota">“Folgas no mês inteiro” é o máximo para quem trabalha o mês todo (0 = não folga). Num mês com férias, as folgas são proporcionais aos dias a trabalhar: folgas × dias a trabalhar ÷ dias do mês, arredondado. Só os turnos “${TURNO_7}” e “${TURNO_8}” entram nas regras de mínimo por turno.</p></div>`;
  return h;
}

function telaFerias() {
  const cad = estado.cadastro, info = infoMes(ui.mes);
  const nomes = Object.fromEntries(cad.funcionarios.map(f => [f.id, f.nome]));
  const opts = cad.funcionarios.map(f => `<option value="${f.id}">${esc(nomeCurto(f.nome))}</option>`).join('');
  let h = `<div class="barra-acoes"><h2>Férias</h2></div><div class="painel"><form id="form-ferias" class="form-linha">
    <label class="campo">Funcionário<select id="fe-func" required>${opts}</select></label>
    <label class="campo">Início<input type="date" id="fe-ini" required value="${info.datas[0]}"></label>
    <label class="campo">Fim<input type="date" id="fe-fim" required value="${info.datas[Math.min(29, info.nDias - 1)]}"></label>
    <label class="campo" style="flex:1;min-width:160px">Observação<input id="fe-obs" placeholder="opcional"></label>
    <button class="btn prim" type="submit">Adicionar férias</button></form>
    <p class="nota">Durante as férias a pessoa aparece como <b>V</b> na escala e conta como ausente: o sistema não dá folga a mais ninguém se isso deixar o dia abaixo do mínimo. Depois de cadastrar, gere a escala do mês de novo.</p></div>`;
  // folgas proporcionais de quem tem férias no mês selecionado
  const comFerias = cad.funcionarios.map(f => ({ f, n: diasFeriasNoMes(cad, f.id, info).size })).filter(x => x.n && x.f.folgas);
  h += `<div class="painel" style="margin-top:18px"><h2>Folgas em ${esc(info.nome)}</h2>
    <p class="nota">As folgas acompanham os dias a trabalhar no mês. Quem trabalha o mês inteiro tem o número cheio de folgas (até ${Math.max(0, ...cad.funcionarios.map(f => f.folgas || 0))}); quem tira férias continua com folgas, na proporção dos dias que vai trabalhar.</p>`;
  if (!comFerias.length) h += `<p class="nota">Ninguém tem férias em ${esc(info.nome)}: todos ficam com o número cheio de folgas.</p>`;
  else {
    h += `<div class="tab-box"><table class="tab"><thead><tr><th>Funcionário</th><th>Dias de férias</th><th>Dias a trabalhar</th><th>Cálculo</th><th>Folgas no mês</th></tr></thead><tbody>`;
    comFerias.forEach(({ f, n }) => {
      h += `<tr><td>${esc(nomeCurto(f.nome))}</td><td>${n}</td><td>${info.nDias - n} de ${info.nDias}</td><td>${contaFolgas(f, n, info.nDias)}</td><td><b>${metaFolgas(f, n, info.nDias)}</b> de ${f.folgas}</td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  h += `</div>`;
  const lista = (cad.ferias || []).slice().sort((a, b) => a.inicio.localeCompare(b.inicio));
  h += `<div class="painel" style="margin-top:18px"><h2>Períodos cadastrados</h2>`;
  if (!lista.length) h += `<p class="nota">Nenhum período de férias cadastrado.</p>`;
  else {
    h += `<div class="tab-box"><table class="tab"><thead><tr><th>Funcionário</th><th>Período</th><th>Dias</th><th>Observação</th><th></th></tr></thead><tbody>`;
    lista.forEach(fe => {
      const dias = Math.round((new Date(fe.fim + 'T12:00') - new Date(fe.inicio + 'T12:00')) / 864e5) + 1;
      const noMes = fe.fim >= info.datas[0] && fe.inicio <= info.datas[info.nDias - 1];
      h += `<tr><td>${esc(nomeCurto(nomes[fe.funcId] || 'Funcionário removido'))} ${noMes ? `<span class="tag agora">${esc(MESES[info.mes - 1])}</span>` : ''}</td><td>${fmtData(fe.inicio)} a ${fmtData(fe.fim)}</td><td>${dias}</td><td>${esc(fe.obs || '')}</td>
        <td><button class="btn perigo" data-acao="del-ferias" data-id="${fe.id}">Remover</button></td></tr>`;
    });
    h += `</tbody></table></div>`;
  }
  return h + `</div>`;
}

const TIPO_FERIADO = { nacional: 'Nacional', estadual: 'Estadual (SP)', municipal: 'Ribeirão Preto', facultativo: 'Ponto facultativo' };
function telaAgenda() {
  const cad = estado.cadastro, info = infoMes(ui.mes), fechados = fechadosNoMes(info), abre = new Set(cad.diasSemana);
  let h = `<div class="barra-acoes"><h2>Agenda do posto</h2></div>
    <p class="nota">Nos dias com o posto fechado ninguém trabalha nem folga, e eles não entram nos mínimos. As férias continuam contando em dias corridos, inclusive fins de semana e feriados.</p>
    <div class="grid2"><section class="painel"><h2>Dias da semana em que o posto abre</h2><div class="form-linha">`;
  [1, 2, 3, 4, 5, 6, 0].forEach(w => h += `<label class="check"><input type="checkbox" id="ds-${w}" data-semana="${w}" ${abre.has(w) ? 'checked' : ''}> ${cap(DIAS_LONGOS[w])}</label>`);
  h += `</div></section>
    <section class="painel"><h2>Outro dia sem funcionamento</h2><form id="form-fechado" class="form-linha">
      <label class="campo">Início<input type="date" id="fx-ini" required value="${info.datas[0]}"></label>
      <label class="campo">Fim<input type="date" id="fx-fim" required value="${info.datas[0]}"></label>
      <label class="campo" style="flex:1;min-width:160px">Motivo<input id="fx-motivo" placeholder="ex.: ponte, dedetização, reforma"></label>
      <button class="btn prim" type="submit">Marcar fechado</button></form>`;
  const extras = (cad.fechados || []).slice().sort((a, b) => a.inicio.localeCompare(b.inicio));
  if (extras.length) {
    h += `<div class="tab-box" style="margin-top:12px"><table class="tab"><thead><tr><th>Período</th><th>Motivo</th><th></th></tr></thead><tbody>`;
    extras.forEach(x => h += `<tr><td>${fmtData(x.inicio)}${x.fim !== x.inicio ? ` a ${fmtData(x.fim)}` : ''}</td><td>${esc(x.motivo)}</td><td><button class="btn perigo" data-acao="del-fechado" data-id="${x.id}">Remover</button></td></tr>`);
    h += `</tbody></table></div>`;
  }
  h += `</section></div>`;
  h += `<section class="painel" style="margin-top:18px"><h2>Feriados de ${info.ano}</h2>
    <p class="nota">Feriados nacionais, de SP e de Ribeirão Preto vêm marcados como fechados; pontos facultativos vêm com o posto aberto. Troque o que não valer para o posto. Confira o São Sebastião (20/01): as fontes não concordam se é feriado municipal.</p>
    <div class="tab-box"><table class="tab"><thead><tr><th>Data</th><th>Feriado</th><th>Tipo</th><th>Posto</th></tr></thead><tbody>`;
  feriadosDoAno(info.ano).forEach(f => {
    const [a, m, d] = f.data.split('-').map(Number), w = new Date(a, m - 1, d).getDay();
    const fecha = feriadoFecha(f, cad), mudou = fecha !== f.fechadoPadrao;
    h += `<tr><td>${fmtData(f.data).slice(0, 5)} <small class="nota">${DIAS_SEM[w].toLowerCase()}</small> ${f.data.slice(0, 7) === ui.mes ? `<span class="tag agora">${esc(MESES[info.mes - 1])}</span>` : ''}</td><td>${esc(f.nome)}</td><td><span class="tag">${TIPO_FERIADO[f.tipo]}</span></td>
      <td><select id="fer-${f.data}" data-feriado="${f.data}" aria-label="Posto em ${esc(f.nome)}"><option value="fechado" ${fecha ? 'selected' : ''}>Fechado</option><option value="aberto" ${fecha ? '' : 'selected'}>Abre</option></select>${mudou ? ' <span class="tag">alterado</span>' : ''}</td></tr>`;
  });
  h += `</tbody></table></div></section>`;
  const abertos = info.nDias - fechados.size;
  h += `<section class="painel" style="margin-top:18px"><h2>${cap(info.nome)}</h2><p>${abertos} dias com o posto aberto, ${fechados.size} fechado(s).</p>`;
  const naoFds = [...fechados].filter(([d]) => !ehFds(info.dow[d]));
  if (naoFds.length) h += `<ul class="alertas avisos">${naoFds.map(([d, m]) => `<li>${pad(d + 1)} (${DIAS_SEM[info.dow[d]].toLowerCase()}): ${esc(m)}</li>`).join('')}</ul>`;
  h += `<p class="nota">Depois de mudar a agenda, gere a escala do mês de novo.</p></section>`;
  return h;
}

function telaRegras() {
  const cad = estado.cadastro, R = cad.regras;
  const opts = sel => cad.funcionarios.map(f => `<option value="${f.id}" ${f.id === sel ? 'selected' : ''}>${esc(nomeCurto(f.nome))}</option>`).join('');
  let h = `<div class="grid2"><section class="painel"><h2>Mínimos por dia</h2><div class="form-linha" style="flex-direction:column;align-items:stretch">
    <label class="campo">Mínimo de trabalhadores por dia (todos os dias)<input type="number" min="0" id="r-minTotal" data-regra="minTotal" value="${R.minTotal}"></label>
    <label class="campo">Mínimo no turno ${TURNO_7} (segunda a sexta)<input type="number" min="0" id="r-min7" data-regra="min7" value="${R.min7}"></label>
    <label class="campo">Mínimo no turno ${TURNO_8} (segunda a sexta)<input type="number" min="0" id="r-min8" data-regra="min8" value="${R.min8}"></label></div>
    <p class="nota">Também valem sempre: folgas sorteadas e distribuídas de forma equilibrada, e pelo menos uma folga em segunda ou sexta, quando possível. Os mínimos só valem nos dias com o posto aberto (aba Agenda).</p>
    <p class="nota"><b>Quando não couber:</b> se não der para dar todas as folgas sem ficar abaixo do mínimo, as <b>quartas</b> ficam com menos gente. Nos outros dias o mínimo é mantido.</p></section>
    <section class="painel"><h2>Não podem folgar no mesmo dia</h2><div class="tab-box"><table class="tab"><tbody>`;
  (cad.pares || []).forEach(([a, b], i) => {
    h += `<tr><td><select id="pa-${i}" data-par="${i}" data-lado="0" aria-label="Funcionário 1">${opts(a)}</select></td><td>e</td><td><select id="pb-${i}" data-par="${i}" data-lado="1" aria-label="Funcionário 2">${opts(b)}</select></td><td><button class="btn perigo" data-acao="del-par" data-i="${i}">Remover</button></td></tr>`;
  });
  h += `</tbody></table></div><p><button class="btn" data-acao="add-par">Adicionar dupla</button></p><p class="nota">Férias contam como ausência: se uma pessoa da dupla estiver de férias, a outra não folga nesses dias.</p></section>
    <section class="painel"><h2>Cópia de segurança</h2><p class="nota">${estado.modo === 'firebase' ? 'Os dados ficam salvos no banco de dados (Firebase) e aparecem para todos que abrem o site. Qualquer pessoa com o link pode alterar: exporte uma cópia de vez em quando.' : estado.modo === 'compartilhado' ? 'Os dados ficam salvos junto com esta página e aparecem para todos que a abrem.' :'Os dados ficam salvos neste navegador. Exporte uma cópia para guardar ou para abrir em outro computador.'}</p>
    <div class="form-linha"><button class="btn" data-acao="exportar">Exportar dados (.json)</button><button class="btn" data-acao="importar">Importar dados</button></div></section></div>`;
  return h;
}

// ======================= ações =======================
// Sorteia algumas distribuições e fica com a que fecha melhor as regras (cada clique dá um resultado diferente).
function sortearMes(chave, tentativas = 3) {
  const cad = estado.cadastro, info = infoMes(chave), fechados = fechadosNoMes(info);
  const F = cad.funcionarios.map(f => {
    const fer = diasFeriasNoMes(cad, f.id, info);
    return { id: f.id, grupo: grupoDoTurno(f.turno), bloqueados: [...fer], meta: metaFolgas(f, fer.size, info.nDias) };
  });
  const idx = Object.fromEntries(F.map((f, i) => [f.id, i]));
  const pares = (cad.pares || []).filter(([a, b]) => a in idx && b in idx && a !== b).map(([a, b]) => [idx[a], idx[b]]);
  const fechado = new Uint8Array(info.nDias); fechados.forEach((m, d) => fechado[d] = 1);
  let melhor = null;
  for (let t = 0; t < tentativas; t++) {
    const r = gerarFolgas({ nDias: info.nDias, dow: info.dow, funcionarios: F, pares, fechado, ...cad.regras, seed: Date.now() + t * 7919 });
    const nota = r.violacoes * 1e6 + r.pendentes * 1e3 + r.faltaQuarta;
    if (!melhor || nota < melhor.nota) melhor = { r, nota };
  }
  const linhas = {};
  F.forEach((f, i) => { const s = new Set(melhor.r.off[i]); let t = ''; for (let d = 0; d < info.nDias; d++) t += s.has(d) ? 'F' : 'T'; linhas[f.id] = t; });
  return { escala: { geradoEm: new Date().toISOString(), base: assinaturaMes(chave), linhas }, r: melhor.r };
}
function gerarMes() {
  ui.gerando = true; ui.confirmar = null; render();
  setTimeout(() => {
    const { escala, r } = sortearMes(ui.mes);
    estado.escalas[ui.mes] = escala;
    salvarEscala(ui.mes);
    ui.gerando = false; render();
    toast(r.violacoes ? 'Escala gerada, mas faltam pessoas em alguns dias. Veja a conferência.'
      : r.pendentes ? `Escala gerada. ${r.pendentes} folga(s) ficaram pendentes mesmo usando as quartas.`
      : r.faltaQuarta ? 'Escala gerada. Não coube tudo: algumas quartas ficaram com menos gente.' : 'Escala gerada. Todas as regras atendidas.');
  }, 30);
}
function alternarCelula(i, d) {
  const g = montarGrade(ui.mes), l = g.linhas[i];
  if (l && l.cel[d] === 'X') { toast(`Posto fechado neste dia (${g.fechados.get(d)}). Para mudar, use a aba Agenda.`); return; }
  if (!l || l.cel[d] === 'V') { toast('Dia de férias. Para mudar, edite o período na aba Férias.'); return; }
  const esc_ = estado.escalas[ui.mes];
  const atual = (esc_.linhas[l.f.id] || 'T'.repeat(g.info.nDias)).padEnd(g.info.nDias, 'T').split('');
  atual[d] = atual[d] === 'F' ? 'T' : 'F';
  esc_.linhas[l.f.id] = atual.join('');
  render(); salvarLinha(ui.mes, l.f.id);
}

async function oferecerArquivo(nome, blob, salvarLocal) {
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: nome, data: blob }); toast('Arquivo salvo.'); }
      catch (e) { if (e && e.code !== 'declined') toast('Não foi possível salvar o arquivo aqui.'); }
      return;
    }
  }
  salvarLocal();
}

function baixarPDF() {
  if (!window.jspdf || !window.jspdf.jsPDF) { toast('O gerador de PDF não carregou. Verifique a internet e recarregue.'); return; }
  const g = montarGrade(ui.mes), v = validar(g), { info, linhas } = g, R = estado.cadastro.regras;
  const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const verde = [15, 107, 95], folga = [246, 196, 173], ferias = [196, 218, 246], fds = [227, 233, 231], verm = [195, 38, 31];
  const titulo = `Escala mensal de trabalho - ${cap(info.nome)}`;
  const cab = () => { doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(21, 48, 44); doc.text('Posto de Saúde', 10, 12); doc.setFontSize(11); doc.text(titulo, 10, 18); };
  cab();
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(79, 102, 98);
  doc.text('T = trabalhando   F = folga   V = férias   - = posto fechado   (amarelo: quarta com menos gente)', W - 10, 18, { align: 'right' });
  const fechados = g.fechados, temFds = info.dow.some((w, d) => ehFds(w) && !fechados.has(d));
  const head = [['Funcionário', 'Turno', ...info.dow.map((w, d) => pad(d + 1)), 'Folgas'], ['', '', ...info.dow.map(w => DIAS_SEM[w].slice(0, 3)), '']];
  const body = linhas.map((l, i) => [nomeCurto(l.f.nome), l.f.turno.replace(' às ', '-'), ...l.cel.map(c => c === 'X' ? '-' : c), `${v.pessoas[i].folgas.length}`]);
  const num = campo => v.dias.map(d => d.fechado ? '-' : String(d[campo]));
  const foot = [
    ['Turno 07h-16h (mín. ' + R.min7 + ' seg-sex)', '', ...num('t7'), ''],
    ['Turno 08h-17h (mín. ' + R.min8 + ' seg-sex)', '', ...num('t8'), ''],
    ['TOTAL TRABALHANDO (mín. ' + R.minTotal + ')', '', ...num('tot'), ''],
  ];
  const larguraDias = (W - 20 - 52 - 18 - 11) / info.nDias;
  const colStyles = { 0: { cellWidth: 52, halign: 'left' }, 1: { cellWidth: 18 } };
  for (let d = 0; d < info.nDias; d++) colStyles[d + 2] = { cellWidth: larguraDias };
  colStyles[info.nDias + 2] = { cellWidth: 11 };
  doc.autoTable({
    startY: 22, head, body, foot, theme: 'grid', margin: { left: 10, right: 10 }, columnStyles: colStyles,
    styles: { fontSize: 7, cellPadding: 1.4, minCellHeight: 7, halign: 'center', valign: 'middle', lineColor: [190, 205, 201], lineWidth: 0.15, textColor: [21, 48, 44] },
    headStyles: { fillColor: verde, textColor: 255, fontStyle: 'bold' },
    footStyles: { fillColor: [232, 238, 236], textColor: [21, 48, 44], fontStyle: 'bold' },
    didParseCell: c => {
      const col = c.column.index - 2;
      if (col < 0 || col >= info.nDias) { if (c.section === 'foot' && c.row.index === 2) { c.cell.styles.fillColor = verde; c.cell.styles.textColor = 255; } return; }
      const fechadoDia = fechados.has(col);
      if (c.section === 'head' && fechadoDia) c.cell.styles.fillColor = [80, 110, 104];
      if (c.section === 'head' && c.row.index === 1) { c.cell.styles.fontSize = 5; c.cell.styles.cellPadding = 0.4; }
      if (c.section === 'body') {
        const val = c.cell.raw;
        if (val === 'F') { c.cell.styles.fillColor = folga; c.cell.styles.fontStyle = 'bold'; c.cell.styles.textColor = [122, 42, 12]; }
        else if (val === 'V') { c.cell.styles.fillColor = ferias; c.cell.styles.fontStyle = 'bold'; c.cell.styles.textColor = [22, 63, 120]; }
        else { if (fechadoDia) c.cell.styles.fillColor = fds; c.cell.styles.textColor = [120, 140, 136]; }
        if (v.conflitoPar[c.row.index].has(col)) { c.cell.styles.lineColor = verm; c.cell.styles.lineWidth = 0.6; }
      }
      if (c.section === 'foot') {
        const dd = v.dias[col];
        if (dd.fechado) { c.cell.styles.fillColor = fds; c.cell.styles.textColor = [120, 140, 136]; return; }
        const ruim = [dd.ruim7, dd.ruim8, dd.ruimTot][c.row.index];
        if (c.row.index === 2) { c.cell.styles.fillColor = verde; c.cell.styles.textColor = 255; }
        if (ruim) { c.cell.styles.fillColor = dd.quarta ? [255, 225, 140] : verm; c.cell.styles.textColor = dd.quarta ? [107, 77, 0] : 255; }
      }
    },
  });
  doc.addPage(); cab();
  doc.autoTable({
    startY: 24, theme: 'grid', margin: { left: 10, right: 10 },
    head: [['Funcionário', 'Turno', 'Dias de folga', 'Férias no mês', 'Dias a trabalhar', 'Folgas', 'Seg/Sex', ...(temFds ? ['Sáb/Dom'] : [])]],
    body: linhas.map((l, i) => {
      const p = v.pessoas[i];
      return [nomeCurto(l.f.nome), l.f.turno, p.folgas.map(d => `${pad(d + 1)}/${pad(info.mes)} (${DIAS_SEM[info.dow[d]].toLowerCase()})`).join(', ') || '-', periodosFerias(l.f.id, info).join('; ') || '-', `${info.nDias - l.nFerias} de ${info.nDias}`, `${p.folgas.length} de ${l.meta}`, String(p.ss), ...(temFds ? [String(p.fds)] : [])];
    }),
    styles: { fontSize: 8, cellPadding: 1.6, valign: 'middle', textColor: [21, 48, 44], lineColor: [190, 205, 201], lineWidth: 0.15 },
    headStyles: { fillColor: verde, textColor: 255 },
    columnStyles: { 0: { cellWidth: 56 }, 1: { cellWidth: 24 }, 2: { cellWidth: 92 }, 3: { cellWidth: 32 }, 4: { cellWidth: 24, halign: 'center' }, 5: { halign: 'center' }, 6: { halign: 'center' }, 7: { halign: 'center' } },
  });
  let y = doc.lastAutoTable.finalY + 8;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text('Conferência das regras', 10, y); y += 5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  const regras = [`Mínimo de ${R.minTotal} trabalhando por dia com o posto aberto.`, `Segunda a sexta: mínimo de ${R.min7} no turno ${TURNO_7} e ${R.min8} no turno ${TURNO_8}.`, 'Férias contam como ausência em todas as regras e em dias corridos.', 'Folgas proporcionais aos dias a trabalhar no mês: folgas do mês inteiro x dias a trabalhar / dias do mês, arredondado.', 'Quando não cabem todas as folgas, as quartas ficam com menos gente; nos outros dias o mínimo é mantido.'];
  const fechadosUteis = [...fechados].filter(([d]) => !ehFds(info.dow[d]));
  if (fechadosUteis.length) regras.push(`Posto fechado (além dos fins de semana): ${fechadosUteis.map(([d, m]) => `${pad(d + 1)}/${pad(info.mes)} ${m}`).join('; ')}.`);
  const pares = (estado.cadastro.pares || []).map(([a, b]) => { const n = id => nomeCurto(estado.cadastro.funcionarios.find(f => f.id === id)?.nome || '?'); return `${n(a)} e ${n(b)} não folgam no mesmo dia.`; });
  let linhasTxt = regras.concat(pares, ['']);
  linhasTxt = linhasTxt.concat(v.alertas.length ? ['Problemas de cobertura:'].concat(v.alertas.map(a => '- ' + a)) : ['Resultado: mínimos diários e duplas atendidos.']);
  if (v.avisos.length) linhasTxt = linhasTxt.concat(['', 'Observações:'], v.avisos.map(a => '* ' + a));
  linhasTxt.forEach(t => { if (y > 200) { doc.addPage(); cab(); y = 26; } if (t.startsWith('- ')) doc.setTextColor(195, 38, 31); else if (t.startsWith('* ')) doc.setTextColor(107, 77, 0); else doc.setTextColor(21, 48, 44); doc.text(t, 10, y); y += 4.2; });
  const n = doc.getNumberOfPages(), quando = new Date();
  for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFontSize(7); doc.setTextColor(120, 140, 136); doc.text(`Gerado em ${pad(quando.getDate())}/${pad(quando.getMonth() + 1)}/${quando.getFullYear()} às ${pad(quando.getHours())}:${pad(quando.getMinutes())}  ·  página ${p} de ${n}`, W - 10, 205, { align: 'right' }); }
  const nome = `Escala ${pad(info.mes)}-${info.ano} - Posto de Saude.pdf`;
  oferecerArquivo(nome, doc.output('blob'), () => doc.save(nome));
}

function exportar() {
  const txt = JSON.stringify({ cadastro: estado.cadastro, escalas: estado.escalas }, null, 2);
  const nome = `escala-posto-backup-${new Date().toISOString().slice(0, 10)}.json`;
  oferecerArquivo(nome, new Blob([txt], { type: 'application/json' }), () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
}
$('#arquivo-import').addEventListener('change', e => {
  const arq = e.target.files[0]; if (!arq) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d.cadastro || !Array.isArray(d.cadastro.funcionarios)) throw new Error('formato');
      estado.cadastro = normalizar(d.cadastro); estado.escalas = {};
      for (const [k, e] of Object.entries(d.escalas || {})) if (/^\d{4}-\d{2}$/.test(k)) estado.escalas[k] = normalizarEscala(e);
      salvarCadastro(); Object.keys(estado.escalas).forEach(k => salvarEscala(k));
      render(); toast('Dados importados.');
    } catch (err) { toast('Arquivo inválido. Use um arquivo exportado por este sistema.'); }
    e.target.value = '';
  };
  fr.readAsText(arq);
});

document.addEventListener('click', e => {
  const aba = e.target.closest('[data-aba]');
  if (aba) { ui.aba = aba.dataset.aba; ui.confirmar = null; render(); return; }
  const cel = e.target.closest('[data-cel]');
  if (cel) { const [i, d] = cel.dataset.cel.split(':').map(Number); alternarCelula(i, d); return; }
  const b = e.target.closest('[data-acao]'); if (!b) return;
  const cad = estado.cadastro, a = b.dataset.acao;
  if (a === 'gerar') gerarMes();
  else if (a === 'pedir-regerar') { ui.confirmar = 'regerar'; render(); }
  else if (a === 'cancelar') { ui.confirmar = null; render(); }
  else if (a === 'pdf') baixarPDF();
  else if (a === 'add-func') { cad.funcionarios.push({ id: novoId(), nome: 'NOVO FUNCIONÁRIO', turno: TURNO_7, folgas: 5 }); salvarCadastro(); render(); const ins = document.querySelectorAll('[data-campo="nome"]'); ins[ins.length - 1]?.select(); }
  else if (a === 'pedir-del-func') { ui.confirmar = 'del-func:' + b.dataset.id; render(); }
  else if (a === 'del-func') {
    const id = b.dataset.id;
    cad.funcionarios = cad.funcionarios.filter(f => f.id !== id);
    cad.pares = (cad.pares || []).filter(p => !p.includes(id));
    cad.ferias = (cad.ferias || []).filter(fe => fe.funcId !== id);
    ui.confirmar = null; salvarCadastro(); render(); toast('Funcionário removido.');
  }
  else if (a === 'del-ferias') { cad.ferias = cad.ferias.filter(fe => fe.id !== b.dataset.id); salvarCadastro(); render(); toast('Período de férias removido.'); }
  else if (a === 'del-fechado') { cad.fechados = cad.fechados.filter(x => x.id !== b.dataset.id); salvarCadastro(); render(); toast('O posto volta a abrir nesse período.'); }
  else if (a === 'add-par') { if (cad.funcionarios.length < 2) return; cad.pares = cad.pares || []; cad.pares.push([cad.funcionarios[0].id, cad.funcionarios[1].id]); salvarCadastro(); render(); }
  else if (a === 'del-par') { cad.pares.splice(Number(b.dataset.i), 1); salvarCadastro(); render(); }
  else if (a === 'exportar') exportar();
  else if (a === 'importar') $('#arquivo-import').click();
});
document.addEventListener('change', e => {
  const t = e.target, cad = estado.cadastro;
  if (t.dataset.func !== undefined) {
    const f = cad.funcionarios[Number(t.dataset.func)]; if (!f) return;
    const c = t.dataset.campo;
    f[c] = c === 'folgas' ? Math.max(0, Math.min(31, parseInt(t.value, 10) || 0)) : (c === 'nome' ? t.value.trim().toUpperCase() : t.value.trim());
    salvarCadastro(); setTimeout(render);
  } else if (t.dataset.regra) {
    cad.regras[t.dataset.regra] = Math.max(0, parseInt(t.value, 10) || 0); salvarCadastro(); setTimeout(render);
  } else if (t.dataset.par !== undefined) {
    cad.pares[Number(t.dataset.par)][Number(t.dataset.lado)] = t.value; salvarCadastro(); setTimeout(render);
  } else if (t.dataset.semana !== undefined) {
    const w = Number(t.dataset.semana), s = new Set(cad.diasSemana);
    if (t.checked) s.add(w); else s.delete(w);
    cad.diasSemana = [...s].sort(); salvarCadastro(); setTimeout(render);
  } else if (t.dataset.feriado) {
    const f = feriadosDoAno(Number(t.dataset.feriado.slice(0, 4))).find(x => x.data === t.dataset.feriado); if (!f) return;
    cad.feriadosAjuste = cad.feriadosAjuste || {};
    if ((t.value === 'fechado') === f.fechadoPadrao) delete cad.feriadosAjuste[f.data]; else cad.feriadosAjuste[f.data] = t.value;
    salvarCadastro(); setTimeout(render);
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'form-fechado') {
    e.preventDefault();
    const inicio = $('#fx-ini').value, fim = $('#fx-fim').value, motivo = $('#fx-motivo').value.trim();
    if (!inicio || !fim) { toast('Preencha o início e o fim.'); return; }
    if (fim < inicio) { toast('A data de fim precisa ser igual ou depois do início.'); return; }
    estado.cadastro.fechados = estado.cadastro.fechados || [];
    estado.cadastro.fechados.push({ id: novoId(), inicio, fim, motivo: motivo || 'Posto fechado' });
    salvarCadastro(); render(); toast('Dia sem funcionamento marcado. Gere a escala do mês de novo.');
    return;
  }
  if (e.target.id !== 'form-ferias') return;
  e.preventDefault();
  const funcId = $('#fe-func').value, inicio = $('#fe-ini').value, fim = $('#fe-fim').value, obs = $('#fe-obs').value.trim();
  if (!funcId || !inicio || !fim) { toast('Preencha funcionário, início e fim.'); return; }
  if (fim < inicio) { toast('A data de fim precisa ser igual ou depois do início.'); return; }
  estado.cadastro.ferias = estado.cadastro.ferias || [];
  estado.cadastro.ferias.push({ id: novoId(), funcId, inicio, fim, obs });
  salvarCadastro(); render(); toast('Férias cadastradas. Gere a escala do mês de novo para redistribuir as folgas.');
});
function mudarMes(n) { ui.mes = somaMes(ui.mes, n); ui.confirmar = null; try { sessionStorage.setItem('escala-mes', ui.mes); } catch (e) {} render(); }
$('#mes-ant').addEventListener('click', () => mudarMes(-1));
$('#mes-prox').addEventListener('click', () => mudarMes(1));

iniciar();
</script>
